# Generated by @afokapu/atdd-bun {{VERSION}}. Do not edit; run `atdd-bun ci init --replace`.
name: ATdd-Bun
on:
  pull_request:
  merge_group:
  push:
    branches: [{{PROTECTED_BRANCHES}}]
jobs:
  atdd-bun:
    name: atdd-bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run atdd-bun integrity
      - run: bun run atdd-bun all
        env:
          # The delivery profile's gate: before the merge on pull requests and the merge queue, after it on a push.
          ATDD_DELIVERY_GATE: ${{ github.event_name == 'push' && 'post-merge' || 'merge' }}
      - run: bun test
      - run: bun run atdd-bun release check
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('**/atdd-bun*.xml', '**/atdd-bun*.json') != ''
        with:
          name: atdd-bun-report
          path: |
            **/atdd-bun*.xml
            **/atdd-bun*.json
