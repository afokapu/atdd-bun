name: ATdd-Bun
on:
  pull_request:
  merge_group:
  push:
    branches: [main, master]
jobs:
  atdd-bun:
    name: atdd-bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run atdd-bun integrity
      # The adoption-aware gate: the full audit (`atdd-bun all`) in greenfield; in brownfield, the change's
      # slice against the pull request's base branch (or, on a push, the previous commit).
      - run: bun run atdd-bun gate
      - run: bun test
      - run: bun run atdd-bun release check
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('**/atdd-bun*.xml', '**/atdd-bun*.json') != ''
        with:
          name: atdd-bun-report
          path: |
            **/atdd-bun*.xml
            **/atdd-bun*.json
