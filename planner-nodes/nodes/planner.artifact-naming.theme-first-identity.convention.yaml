schema_version: 1.0.0
rule_id: planner.artifact-naming.theme-first-identity
kind: rule
status: active
name: Artifact identity is theme-first
statement: A produced or consumed artifact/contract identity must be theme-first — it must
  parse as the grammar {theme}(:{category})*:{aspect}(.{variant})?, every colon/dot
  token must be kebab-case, and the leading theme must be declared in plan/_themes.yaml.
terms:
- term_id: artifact_theme_first_identity
  text: the theme-first identity rule for a produced artifact/contract name
  values:
    theme_source: plan/_themes.yaml
    grammar: "{theme}(:{category})*:{aspect}(.{variant})?"
    examples_ok:
    - commons:identifiers.uuid
    - commons:ux:foundations:color
    - orders:checkout.submitted
    - inventory:stock
    examples_bad:
    - undeclared:result
    - Bad:Theme
    - gesture.raw
implementation:
  type: validator
  ref: planner.static.validators.bun
metadata:
  severity: 3
  disposition: strict
validation:
  family: format
  template: naming_pattern
  variant: planner_artifact_theme_first_identity
  phase: CONFIRM
  enforcement: confirm-blocking
  subject_kind: artifact
  failure_evidence:
  - artifact_name
  - reason
