schema_version: 1.1.0
rule_id: planner.theme.must-be-canonical
kind: rule
status: active
name: Theme must be repository-declared
statement: Every wagon, train, interlocking, and contract theme MUST resolve to a value in the
  repository-owned plan/_themes.yaml registry. The package provides no default taxonomy.
implementation:
  type: validator
  ref: planner.static.validators.bun
source:
  legacy_path: src/atdd/planner/conventions/theme.convention.yaml
  legacy_section: rules
  legacy_sha: 2ae106d04d77b06e
  extraction_mode: high_fidelity
  legacy_rule_id: planner.theme.must-be-canonical
content:
  normative_text: A repository may choose any kebab-case name except that index 0 is reserved
    for commons. An undeclared theme is a plan error, not a package-default lookup.
metadata:
  aliases:
  - PLANNER-THEME-CANONICAL-001
  severity: 3
  disposition: strict
parity:
  source_fragments_preserved: true
  examples_preserved: false
  implementation_preserved: true
  fix_hint_preserved: false
  reviewed_at: '2026-06-16'
terms:
- term_id: canonical_resolution
  text: a theme resolving to a value in plan/_themes.yaml.
  values:
    source: plan/_themes.yaml
    package_defaults: none
    consumer_repo: declares its own names
notes: The package never supplies a game or toolkit vocabulary.
