schema_version: 1.1.0
rule_id: planner.theme.definition
kind: family
status: active
name: Repository-owned theme namespace
statement: A theme is a repository-defined kebab-case namespace for plan artifacts. The only
  reserved entry is index 0, which MUST be commons; repositories declare every other theme
  in plan/_themes.yaml. Theme membership and identity-prefix consistency are enforceable.
terms:
- term_id: semantic_anchor
  label: Advisory semantic anchor
  text: a definitional node that gives the artifact a stable meaning but is not itself
    bound to a validator; it is transitively protected by the enforceable constraint/rule
    nodes that require it.
- term_id: theme
  label: Repository-owned theme
  text: theme -> {kebab-case namespace, registry membership, identity prefix}.
  values:
    registry: plan/_themes.yaml
    reserved_zero: commons
    format: ^[a-z][a-z0-9-]*$
    membership: every declared theme is a value in the repository registry
    identity_prefix: the first segment of an artifact or contract identity equals its theme
