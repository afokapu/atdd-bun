schema_version: 1.1.0
rule_id: planner.theme.theme-zero-mandatory
kind: constraint
status: active
name: Theme zero is mandatory
statement: 'plan/_themes.yaml MUST declare commons at theme index 0. Repositories may add any
  valid theme at other indexes, but may not replace or remove the commons floor.'
implementation:
  type: validator
  ref: planner.static.validators.bun
source:
