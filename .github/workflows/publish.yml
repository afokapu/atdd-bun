# Publishes @afokapu/atdd-bun to npm on every push to main that touches packaged files.
# Version is automatic: next patch after the latest published version, unless
# package.json already declares a higher version (bump it by hand for minor/major).
# Auth uses npm trusted publishing (OIDC) — no NPM_TOKEN secret.
name: Publish
on:
  push:
    branches: [main]
    paths:
      - src/**
      - detectors/**
      - lib/**
      - conventions/**
      - planner-nodes/**
      - planner-schemas/**
      - templates/**
      - bunfig.toml
      - package.json
      - bun.lock
      - relationships.yaml
      - README.md
      - PLANNER_PORT.md
      - HOOK_AUDIT.md
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Install Chromium for the frontend chain test
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: bun test
      - name: Compute next version
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          local=$(node -p "require('./package.json').version")
          published=$(npm view "$name" version 2>/dev/null || echo "0.0.0")
          next=$(LOCAL="$local" PUBLISHED="$published" node -e '
            const [l, p] = [process.env.LOCAL, process.env.PUBLISHED].map(v => v.split("-")[0].split(".").map(Number));
            const gt = l[0] - p[0] || l[1] - p[1] || l[2] - p[2];
            console.log(gt > 0 ? l.join(".") : [p[0], p[1], p[2] + 1].join("."));
          ')
          echo "published=$published next=$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - run: npm version "${{ steps.version.outputs.next }}" --no-git-tag-version --allow-same-version
      - name: Write integrity manifest
        run: bun -e 'import { writeManifest } from "./src/integrity"; const files = JSON.parse(Bun.spawnSync(["npm", "pack", "--dry-run", "--json"]).stdout.toString())[0].files.map((f) => f.path); console.log(await writeManifest(process.cwd(), files), "files hashed");'
      # The tag must be the exact tree that is published. The version bump and integrity.json are generated
      # here and never committed to main, so a release commit carrying both is made on top of the merge
      # commit BEFORE publishing, and npm publishes that tree. Only the annotated tag is pushed; main is
      # untouched. npm provenance attests the workflow's source commit (github.sha), which the tag names.
      # Before this, v0.6.1 pointed at a commit whose package.json still said 0.6.0.
      - name: Release commit
        run: |
          next="${{ steps.version.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f package.json integrity.json
          git commit --allow-empty -m "release: v$next [skip ci]" -m "Provenance source: ${{ github.sha }}"
          test "$(git show HEAD:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')" = "$next"
          # Every file npm will pack is committed, unchanged, in this release commit.
          npm pack --dry-run --json | node -e 'for (const f of JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files) console.log(f.path)' > "$RUNNER_TEMP/packed"
          xargs git ls-files --error-unmatch < "$RUNNER_TEMP/packed" > /dev/null
          xargs git diff --quiet HEAD -- < "$RUNNER_TEMP/packed"
      - run: npm publish --provenance --access public
      - name: Tag release
        run: |
          next="${{ steps.version.outputs.next }}"
          git tag -a "v$next" -m "v$next, published from this tree; provenance source ${{ github.sha }}"
          git push origin "v$next"
