entrypoint: detect.mjs
report: detect.mjs
realizes_convention:
# All ten, as a LIST. The Vite sibling declares a SCALAR here
# (`realizes_convention: coder.vite.green-urn-marker`) while emitting ten rule ids,
# so its binder indexes ONE convention and the other nine bind to nothing — they
# are authored, admitted, and silently unenforced. Verified against this same
# binder: a scalar yielded "2 bound" for a 9-rule package, a list yielded "9 bound".
- coder.bun.green-header-order
- coder.bun.green-header-purpose
- coder.bun.green-header-runtime
- coder.bun.green-header-tested-by
- coder.bun.green-urn-layer
