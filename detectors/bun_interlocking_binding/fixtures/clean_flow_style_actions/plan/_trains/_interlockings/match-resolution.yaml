# CLEAN fixture — entrypoint.actions in FLOW style.
#
# The interlocking YAML is stack-neutral planner data and a flow sequence is
# ordinary YAML. Python reads it with a real parser and accepts both; this
# provider's hand-rolled line scanner accepted only block style, so the same
# plan file was judged differently depending on which stack read it — and the
# verdict was a strict, blocking 'exposed interlocking is unreachable'.
# Interlocking route space (core afokapu/atdd#1248) — stack-neutral planner data (snake_case).
# Authoritative for the guarded routes; the runtime + Station Master + trace bind to it.
