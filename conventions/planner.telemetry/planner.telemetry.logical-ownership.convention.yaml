schema_version: 1.1.0
rule_id: planner.telemetry.logical-ownership
kind: rule
status: active
name: Concrete telemetry resolves to exactly one wagon-owned logical artifact
statement: >-
  Every concrete tracking-plan item's logical artifact is produced by exactly one wagon's
  produce[] telemetry declaration, and the item's owner names that wagon (REQUIRED).
terms:
- term_id: ownership_declaration
  text: >-
    a wagon produce[] entry whose telemetry field (string or list) names the logical artifact
    URN telemetry:{theme}:{artifact}. Ownership lives in the plan, not in the registry.
- term_id: owner
  text: >-
    the tracking-plan item field naming the wagon slug accountable for the artifact. It must equal
    the wagon whose produce[] declares the logical artifact.
content:
  summary: >-
    A logical telemetry artifact with two producers is a coincidence waiting to diverge; with none,
    it is emitted by code no plan stands behind. Both are plan defects, caught at the item.
  normative_text: |
    The registry does not grant ownership; it resolves against ownership the plan already declares.
    For each item, the logical artifact must appear in exactly one wagon's produce[] telemetry, and
    the item's owner field must equal that wagon's slug. Zero owners means no wagon has stood behind
    the observable outcome; more than one means the emission contract has two authors with no
    arbiter.
  fix_hint: |
    Declare the logical artifact on the producing wagon, and name that wagon as owner:

      # plan/commons/_commons.yaml
      produce:
        - name: commons:response-invocation
          contract: null
          telemetry: telemetry:commons:response-invocation-accepted
  exceptions:
  - >-
    Duplicate producers at the wagon level are also reported by planner.wagon.telemetry-filesystem
    under the planner profile; this rule reports the same ambiguity at the item level under the
    telemetry profile, so an adopting repository sees it whichever profile it runs.
metadata:
  aliases:
  - TELEMETRY-LOGICAL-OWNERSHIP-001
  severity: 2
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.7.0
implementation:
  type: validator
  ref: planner_telemetry_plan
