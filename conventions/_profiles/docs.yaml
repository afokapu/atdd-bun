schema_version: "1.0.0"
profile: "docs"
implementations:
  - "planner_docs_capability"
conventions:
  - rule_id: "planner.docs.adr-registry-derived"
    path: "conventions/planner.docs/planner.docs.adr-registry-derived.convention.yaml"
  - rule_id: "planner.docs.area-index-required"
    path: "conventions/planner.docs/planner.docs.area-index-required.convention.yaml"
  - rule_id: "planner.docs.artifact-path-shape"
    path: "conventions/planner.docs/planner.docs.artifact-path-shape.convention.yaml"
  - rule_id: "planner.docs.asciidoc-only"
    path: "conventions/planner.docs/planner.docs.asciidoc-only.convention.yaml"
  - rule_id: "planner.docs.doc-id-unique"
    path: "conventions/planner.docs/planner.docs.doc-id-unique.convention.yaml"
  - rule_id: "planner.docs.graph-target-resolves"
    path: "conventions/planner.docs/planner.docs.graph-target-resolves.convention.yaml"
  - rule_id: "planner.docs.identity-required"
    path: "conventions/planner.docs/planner.docs.identity-required.convention.yaml"
  - rule_id: "planner.docs.journey-view-current"
    path: "conventions/planner.docs/planner.docs.journey-view-current.convention.yaml"
  - rule_id: "planner.docs.reference-integrity"
    path: "conventions/planner.docs/planner.docs.reference-integrity.convention.yaml"
  - rule_id: "planner.docs.undeclared-change"
    path: "conventions/planner.docs/planner.docs.undeclared-change.convention.yaml"
relationships:
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.planner.docs/relationships.yaml"
    reason: "The registry is a projection of :decides: edges, so it is only as trustworthy as edge resolution. An ADR deciding an undeclared node is reported by the resolver, never listed in the registry."
    source_ref: "planner.docs.adr-registry-derived"
    strength: "important"
    target_ref: "planner.docs.graph-target-resolves"
    type: "requires"
  - confidence: 1
    constraint: "discretionary"
    control: "internal"
    foundation: "start_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.planner.docs/relationships.yaml"
    reason: "Both are canonical-tree shape rules read from the same scan of docs/: one governs what an area contains, the other what format its files are in."
    source_ref: "planner.docs.area-index-required"
    strength: "minor"
    target_ref: "planner.docs.asciidoc-only"
    type: "runs_alongside"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.planner.docs/relationships.yaml"
    reason: "Uniqueness compares ids that were actually declared; a document with no doc-id is reported by identity-required and never counted as a collision here."
    source_ref: "planner.docs.doc-id-unique"
    strength: "critical"
    target_ref: "planner.docs.identity-required"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.planner.docs/relationships.yaml"
    reason: "Resolution needs exactly one target per id. Under a duplicate, :supersedes: cannot say which document it means, so uniqueness must hold before an edge can be said to resolve."
    source_ref: "planner.docs.graph-target-resolves"
    strength: "critical"
    target_ref: "planner.docs.doc-id-unique"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.planner.docs/relationships.yaml"
    reason: "The declared-id set is built from :doc-id: attributes BEFORE any edge is resolved. This edge is the no-fabrication discipline expressed as an ordering: without the set first, the resolver would have to invent what it resolves against."
    source_ref: "planner.docs.graph-target-resolves"
    strength: "critical"
    target_ref: "planner.docs.identity-required"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.planner.docs/relationships.yaml"
    reason: "A doc-id lives in an AsciiDoc attribute. A markdown document has nowhere to declare one, so format uniformity is the precondition for identity."
    source_ref: "planner.docs.identity-required"
    strength: "critical"
    target_ref: "planner.docs.asciidoc-only"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "@afokapu/atdd-bun"
    reason: "the generated page is a document like any other and must carry its doc-id and status"
    source_ref: "planner.docs.journey-view-current"
    strength: "important"
    target_ref: "planner.docs.identity-required"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "start_to_start"
    origin: "@afokapu/atdd-bun"
    reason: "both keep the rendered documentation truthful: one that references resolve, the other that the drawn journeys are the planned ones"
    source_ref: "planner.docs.journey-view-current"
    strength: "important"
    target_ref: "planner.docs.reference-integrity"
    type: "runs_alongside"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "@afokapu/atdd-bun"
    reason: "the journey view is rendered from the journey topology the plan declares"
    source_ref: "planner.docs.journey-view-current"
    strength: "critical"
    target_ref: "planner.journey.definition"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.planner.docs/relationships.yaml"
    reason: "asciidoctor renders the authored corpus. A markdown file under docs/ is not an input the renderer can resolve references through, so the format rule bounds what reference-integrity can even see."
    source_ref: "planner.docs.reference-integrity"
    strength: "important"
    target_ref: "planner.docs.asciidoc-only"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "start_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.planner.docs/relationships.yaml"
    reason: "The two halves of the declaration check: one asks whether a declared path is SHAPED like documentation, the other whether a documentation change was declared at all. Together they close the loop core opens; neither alone does."
    source_ref: "planner.docs.undeclared-change"
    strength: "critical"
    target_ref: "planner.docs.artifact-path-shape"
    type: "runs_alongside"
