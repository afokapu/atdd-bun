    path: "conventions/tester.bun/tester.bun.interlocking-train-sequence-is-exercised.convention.yaml"
relationships:
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "start_to_start"
    origin: "@afokapu/atdd-bun"
    reason: "every route has an end-to-end proof: at its canonical path, and exercising the production runner"
    source_ref: "atdd-bun.topology.e2e-location"
    strength: "important"
    target_ref: "tester.bun.interlocking-route-coverage"
    type: "runs_alongside"
  - confidence: 1
    constraint: "discretionary"
    control: "internal"
    foundation: "start_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.coder.bun/relationships.yaml"
    reason: "Both govern server.ts as the composition root: one that collaborators are only instantiated there, the other that the JOURNEY_MAP it holds agrees with the declared route space."
    source_ref: "coder.bun.interlocking-bilateral-binding"
    strength: "minor"
    target_ref: "coder.bun.composition-root"
    type: "runs_alongside"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.coder.bun/relationships.yaml"
    reason: "Bilateral binding closes declaration, runtime, station and trace against each other. Two of its five directions are Station Master directions, so the station wiring must hold before closure can be asserted."
    source_ref: "coder.bun.interlocking-bilateral-binding"
    strength: "critical"
    target_ref: "coder.bun.station-master-interlocking-routing"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.coder.bun/relationships.yaml"
    reason: "Delegation is a property OF the runner; a tree with no InterlockingRunner has nothing that could fail to delegate."
    source_ref: "coder.bun.interlocking-delegates-to-trainrunner"
    strength: "critical"
    target_ref: "coder.bun.interlocking-runner-exists"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "start_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.coder.bun/relationships.yaml"
    reason: "The two halves of one idea: route control must not become execution. One forbids running the wagons, the other forbids touching the data plane they carry."
    source_ref: "coder.bun.interlocking-does-not-carry-cargo"
    strength: "critical"
    target_ref: "coder.bun.interlocking-delegates-to-trainrunner"
    type: "runs_alongside"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.coder.bun/relationships.yaml"
    reason: "A structured resolution is what resolveTrain RETURNS, so there is nothing to structure until the route-control layer exists. Runner first, then the shape of its verdict."
    source_ref: "coder.bun.interlocking-resolution-model-exists"
    strength: "critical"
    target_ref: "coder.bun.interlocking-runner-exists"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "@afokapu/atdd-bun"
    reason: "JourneyRunner is the continuation layer above InterlockingRunner and delegates each routing decision to it"
    source_ref: "coder.bun.journey-runner-boundary"
    strength: "critical"
    target_ref: "coder.bun.interlocking-runner-exists"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "@afokapu/atdd-bun"
    reason: "JourneyRunner executes the continuation topology the plan declares; without a declared journey there is nothing for it to compose"
    source_ref: "coder.bun.journey-runner-boundary"
    strength: "critical"
    target_ref: "planner.journey.definition"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.coder.bun/relationships.yaml"
    reason: "Bilateral binding closes a TEXT-level correspondence — literals in the runtime also appear in the plan. This asks the harder question underneath it: whether the runtime ever READS the plan, or merely restates it."
    source_ref: "coder.bun.runtime-executes-the-declaration"
    strength: "critical"
    target_ref: "coder.bun.interlocking-bilateral-binding"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "start_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.coder.bun/relationships.yaml"
    reason: "Complementary halves of one guarantee about the resolution model. The shape rule proves an InterlockingResolution declaring the eight fields EXISTS; only a typechecker proves what resolveTrain actually returns conforms to it, and Bun runs .ts without checking."
    source_ref: "coder.bun.runtime-typecheck-enforced"
    strength: "important"
    target_ref: "coder.bun.interlocking-resolution-model-exists"
    type: "runs_alongside"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.coder.bun/relationships.yaml"
    reason: "server.ts can only route THROUGH an InterlockingRunner that exists; the Station Master obligation presupposes the runtime one."
    source_ref: "coder.bun.station-master-interlocking-routing"
    strength: "important"
    target_ref: "coder.bun.interlocking-runner-exists"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "@afokapu/atdd-bun"
    reason: "an exposed journey is reached through JourneyRunner, so the runner boundary must hold before routing to it"
    source_ref: "coder.bun.station-master-journey-routing"
    strength: "critical"
    target_ref: "coder.bun.journey-runner-boundary"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "start_to_start"
    origin: "@afokapu/atdd-bun"
    reason: "the two Station Master routing obligations: exposed journeys through JOURNEY_MAP, exposed interlockings through their own mapping"
    source_ref: "coder.bun.station-master-journey-routing"
    strength: "important"
    target_ref: "coder.bun.station-master-interlocking-routing"
    type: "runs_alongside"
  - confidence: 1
    constraint: "discretionary"
    control: "internal"
    foundation: "start_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.coder.bun/relationships.yaml"
    reason: "The two halves of the artifact data plane. One keeps Cargo inside TrainRunner execution, the other requires the wagon at the end of that execution to move the artifacts its plan document declares. Neither implies the other, and a stack satisfying only one still lets the declared contract and the carried data disagree."
    source_ref: "coder.bun.wagon-honours-its-contract"
    strength: "important"
    target_ref: "coder.bun.interlocking-does-not-carry-cargo"
    type: "runs_alongside"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.tester.bun/relationships.yaml"
    reason: "Coverage counts a route as proven only if the covering test drove the real runners. A route covered by a test that mocks the route-control path is a DESCRIPTIVE green, so production-runner-used is what makes route-coverage mean anything."
    source_ref: "tester.bun.interlocking-production-runner-used"
    strength: "critical"
    target_ref: "tester.bun.interlocking-route-coverage"
    type: "requires"
  - confidence: 1
    constraint: "discretionary"
    control: "internal"
    foundation: "start_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.tester.bun/relationships.yaml"
    reason: "Both bind the suite back to a planner declaration: one to the acceptance criterion a test covers, the other to the guarded route it exercises."
    source_ref: "tester.bun.interlocking-route-coverage"
    strength: "minor"
    target_ref: "tester.bun.acceptance-binding-declared"
    type: "runs_alongside"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "start_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.tester.bun/relationships.yaml"
    reason: "Two coverage obligations over the same declaration: one per admissible ROUTE, one per exposed Station Master ACTION. The criticality signal for the second is the core entrypoint.exposed field, never a heuristic."
    source_ref: "tester.bun.interlocking-smoke-coverage-for-station-master"
    strength: "important"
    target_ref: "tester.bun.interlocking-route-coverage"
    type: "runs_alongside"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.tester.bun/relationships.yaml"
    reason: "A covering test proves a route ran; only the bound trace proves WHICH route ran. Without the binding fields the run could resolve the wrong route, category or guard and the coverage test would still pass."
    source_ref: "tester.bun.interlocking-trace-binds-declared-route"
    strength: "critical"
    target_ref: "tester.bun.interlocking-route-coverage"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "finish_to_start"
    origin: "atdd-extensions@3aa141e:official/atdd.extension.tester.bun/relationships.yaml"
    reason: "Route coverage proves WHICH train a route selects; this proves WHAT it ran. A train whose wagon sequence is wrong is selected correctly and executes the wrong thing, so selection coverage must hold before execution coverage means anything."
    source_ref: "tester.bun.interlocking-train-sequence-is-exercised"
    strength: "critical"
    target_ref: "tester.bun.interlocking-route-coverage"
    type: "requires"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "start_to_start"
    origin: "@afokapu/atdd-bun"
    reason: "a journey run end to end in a browser beside each exposed interlocking action smoke-tested through the Station Master"
    source_ref: "tester.htmx.exposed-journey-e2e-coverage"
    strength: "important"
    target_ref: "tester.bun.interlocking-smoke-coverage-for-station-master"
    type: "runs_alongside"
  - confidence: 1
    constraint: "mandatory"
    control: "internal"
    foundation: "start_to_start"
    origin: "@afokapu/atdd-bun"
    reason: "browser coverage per train beside runner-level coverage per interlocking route"
    source_ref: "tester.htmx.train-e2e-coverage"
    strength: "important"
    target_ref: "tester.bun.interlocking-route-coverage"
    type: "runs_alongside"
