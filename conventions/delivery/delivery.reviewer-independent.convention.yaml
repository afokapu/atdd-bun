schema_version: 1.1.0
rule_id: delivery.reviewer-independent
kind: rule
status: active
name: Every reviewer is a fresh process independent of the writers
statement: >-
  A reviewer's run never wrote anything in the tranche and never reviewed another entry; where the stage requires different-model independence (the default), the reviewer's model wrote none of the work the review answers for: its own stage and every stage since the previous reviewed one (REQUIRED).
terms:
- term_id: run
  text: >-
    the identity of one process: a session id, a pane id with its start time, or the retained report. Two entries with the same run were produced by the same process.
- term_id: independence
  text: >-
    fresh-process: the reviewer is a new process that wrote nothing. different-model: additionally, its model wrote none of the work it reviews; the final review answers for red, green and refactor when none of them is reviewed, and a review whose range recorded no work answers for the latest recorded work before it.
content:
  summary: >-
    A reviewer that edits becomes a writer, and a reviewer that already saw an earlier round is anchored to it. Independence is what makes an approval evidence.
  normative_text: |
    Every review is a new process. The run identifiers make that checkable: a reviewer run that appears as a writer anywhere in the tranche, or on a second review, is not independent. The stricter mode is chosen per stage in the policy.
  fix_hint: |
    Re-run the review in a fresh process and record its own run; under different-model, use the next reviewer model in the list that wrote none of the reviewed work.
  exceptions:
  - >-
    The persistent driver dispatches the work and opens the PR; its run may never review.
metadata:
  aliases:
  - DELIVERY-REVIEWER-INDEPENDENT-001
  severity: 3
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.8.0
implementation:
  type: validator
  ref: delivery_evidence
