schema_version: 1.1.0
rule_id: delivery.model-allowed
kind: rule
status: active
name: Authors and reviewers are allowed models, and every fallback says why
statement: >-
  Each review's author and reviewer model appears in that stage's authors and reviewers lists; a model after the first is used only with a recorded fallback from each model before it, stating the kind of unavailability (outage, rate_limit, no_report, timeout), the failures observed, at least delivery.fallback.after_failures, and the reason (REQUIRED).
terms:
- term_id: fallback
  text: >-
    a recorded switch from a preferred model to the next one in the stage's list, with role (author or reviewer) and a reason: an outage, a rate limit, or no auditable report. A REQUEST CHANGES verdict is never a reason.
content:
  summary: >-
    The lists are the operator's choice of who may do the work. A silent switch to another model hides an outage and can hide a reviewer chosen for being lenient.
  normative_text: |
    The first model in a list is used normally. When it is unavailable, the driver falls back to the next one and records it. A fallback is never triggered by a verdict: shopping for a reviewer until one approves is exactly what this rule exists to expose.
  fix_hint: |
    Record the fallback on the review:

      fallback:
        - { role: reviewer, from: glm, kind: rate_limit, failures: 3, reason: "429 on 3 attempts in 10 minutes" }

    or use a model the stage lists.
  exceptions:
  - >-
    When a stage lists one model, no fallback is possible: an unavailable model blocks the tranche.
metadata:
  aliases:
  - DELIVERY-MODEL-ALLOWED-001
  severity: 2
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.8.0
implementation:
  type: validator
  ref: delivery_evidence
