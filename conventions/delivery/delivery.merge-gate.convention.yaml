schema_version: 1.1.0
rule_id: delivery.merge-gate
kind: rule
status: active
name: A tranche merges only its approved SHA
statement: >-
  At the merge gate (ATDD_DELIVERY_GATE=merge, set by the generated CI on pull requests and the merge queue), every evidence record the branch changes is ready, and the branch head differs from its approved_sha only under the delivery root (REQUIRED).
terms:
- term_id: merge_gate
  text: >-
    the CI run that decides whether a pull request may merge. It compares the branch against the base it merges into; for a merge checkout, the base is the first parent and the head the second.
content:
  summary: >-
    Any commit after approval, a code change, a regenerated file, a conflict resolution or a rebase, invalidates it. The evidence commit itself is the one change allowed, since it cannot be in the SHA it records.
  normative_text: |
    This is where the profile becomes a merge rule rather than an instruction. Records that the branch does not change, earlier tranches already on the base branch, are not judged again; their approved SHAs may no longer be the head of anything.
  fix_hint: |
    Run the final review on the current head and record its SHA as approved_sha, or remove the change made after approval. Locally, reproduce the gate with ATDD_DELIVERY_GATE=merge ATDD_BASE_REF=origin/main bun run atdd-bun delivery.
  exceptions:
  - >-
    Outside the merge gate (hooks, local runs, pushes to the base branch) this rule emits nothing, so a tranche can push work in progress.
metadata:
  aliases:
  - DELIVERY-MERGE-GATE-001
  severity: 3
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.8.0
implementation:
  type: validator
  ref: delivery_evidence
