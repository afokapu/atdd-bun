schema_version: 1.1.0
rule_id: delivery.stages-complete
kind: rule
status: active
name: A ready record has every configured stage approved
statement: >-
  A record with status ready has, for every stage the policy gives a reviewer, a last review that approves (a stage with nothing written records no work); its approved_sha is the SHA the last review of the closing stage approved; and every review names its retained raw report, which exists (REQUIRED).
terms:
- term_id: closing_stage
  text: >-
    the last reviewed stage in lifecycle order (plan, red, green, refactor, final); by default final, the review of the PR head, which answers for everything written since the plan review.
content:
  summary: >-
    Ready is the driver's claim that the tranche can merge. It is only true when no stage is missing and the approval covers the commit being merged.
  normative_text: |
    Each stage may take several rounds; only its last review counts. The closing stage's approval names the SHA the whole tranche stands on, and approved_sha must be that SHA: the merge gate compares the branch head against it.
  fix_hint: |
    Run the missing review, or set status back to open until it has run. Set approved_sha to the SHA the final review approved.
  exceptions:
  - >-
    A ready record is judged by the policy in atdd-bun.yaml at its approved_sha, the policy it was approved under; a later policy change does not re-judge it. A record in progress is judged by the current policy.
  - >-
    A stage the policy omits is not required. Omitting one loosens the policy and is reported by the integrity check until a human approves it.
metadata:
  aliases:
  - DELIVERY-STAGES-COMPLETE-001
  severity: 3
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.8.0
implementation:
  type: validator
  ref: delivery_evidence
