schema_version: 1.1.0
rule_id: planner.docs.adr-registry-derived
kind: rule
status: active
name: 'The ADR registry is derived from :decides: edges, never hand-maintained'
statement: >-
  `docs/architecture/decisions/index.adoc` MUST list exactly the ADRs the corpus declares, derived
  from their `:decides:` edges. An ADR present in the tree and absent from the registry — or listed
  in the registry and absent from the tree — is a violation. The registry is a projection, never a
  typed list (spec 2 §5.2, §6).

  WHAT COUNTS AS A LISTING. Where the registry declares a machine-maintained region —
  `// BEGIN GENERATED: adr-register` … `// END GENERATED: adr-register`, the markers a generator
  writes around its own output — only that region is read. A corpus whose generator marks its
  output has already said where its list begins and ends, and taking it at its word beats any
  heuristic. Where no region is declared, the file is read minus its `----` listing blocks: an ADR
  skeleton shown in fences illustrates the shape and lists nothing. A prose mention outside a
  declared region is NOT excused — a sentence naming an id and a list entry naming one cannot be
  told apart without guessing at a corpus's formatting, and a corpus that wants prose ignored says
  so with the markers.
terms:
- term_id: adr
  text: >-
    a document at `docs/architecture/decisions/adr-YYYYMMDD-NNN-<slug>.adoc` declaring `:adr-id:`,
    `:status:`, `:date:` and `:decides:`.
- term_id: generated_region
  text: >-
    a machine-maintained span delimited by `// BEGIN GENERATED: <name>` and
    `// END GENERATED: <name>`, which a generator rewrites in place; where the registry declares
    one named `adr-register`, that span is the listing the projection is compared against.
- term_id: derived_registry
  text: >-
    `index.adoc` in the decisions directory, whose entries are computed from the set of ADR files and
    their `:decides:` targets. It contains references to the decisions, never the decisions themselves.
- term_id: disposition_rationale
  text: >-
    advisory while the consuming corpus is brought into compatibility. The measurement below was
    TAKEN on 2026-09-06, not recalled — #1782 found this convention's own recorded measurement
    already stale, so the date lives in the key and the command is recorded beside the result.
    Re-take it at the escalation checkpoint; never escalate on the number here.
  values:
    measured_2026_09_06: 'The decisions directory does not exist and there are 0 ADR files. Spec 2 §6 names the first two: ADR-20260906-001 (shared control root) and ADR-20260906-002 (the documentation system itself, authored as current documentation — the proof the system works).'
    measurement_target: 'afokapu/atdd @ main (/Users/alecfokapu/Github/atdd/main)'
    measurement_command: 'ls -d docs/architecture/decisions 2>&1 ; find . -name ''adr-*.adoc'' | wc -l'
    escalate_when: '`docs/architecture/decisions/` exists and its index.adoc matches the derived projection exactly on a full scan.'
content:
  summary: >-
    A hand-maintained list of decisions drifts from the decisions — precisely the failure class ATDD
    exists to kill, reproduced inside the documentation system itself. Deriving the registry makes
    drift impossible rather than detectable.
  normative_text: |
    One architectural decision lives in ONE ADR file (spec 2 §6). The registry's job is to make the
    set of them navigable, and the moment a human types an entry into it the set has two sources of
    truth.

    The check is bidirectional on purpose. A missing entry is the obvious drift; a STALE entry — an
    ADR listed after its file was renamed or removed — is the one that survives review, because a
    list that names something is read as authoritative about it.

    An ADR's `:decides:` target is resolved by `planner.docs.graph-target-resolves` like any other
    edge. An ADR deciding an architecture node that no document declares is reported there, not here.
  fix_hint: |
    Regenerate the registry rather than editing it:

      atdd docs build        # once #1623 lands the operator verbs (spec 2 §7)

    Until then the capability reports the delta and the registry is regenerated by the same code
    path the check uses, so the two can never disagree. If you find yourself typing an entry into
    `decisions/index.adoc`, the entry belongs in an ADR file with a `:decides:` attribute instead.
  exceptions:
  - Prose surrounding the derived entries in `index.adoc` (a title, an introductory paragraph) is not
    compared. Only the set of ADR references is.
  - A decisions directory holding no ADRs requires no entries; an empty registry is a correct
    projection of an empty set.
metadata:
  aliases:
  - DOCS-ADR-001
  severity: 2
  disposition: advisory
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: docs_capability
