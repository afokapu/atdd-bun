schema_version: 1.1.0
rule_id: planner.docs.journey-view-current
kind: rule
status: active
name: The journey documentation is generated from plan/ and matches it
statement: >-
  When a repository documents itself (`docs/` exists) and its plan declares journeys or interlockings,
  `docs/purpose/journeys/` MUST contain exactly what `atdd-bun docs journeys` generates from `plan/`:
  `index.adoc` and one SVG per journey map, per journey's nominal path, and per routed train. A missing,
  stale, hand-edited, or extra file is a violation.
terms:
- term_id: journey_view
  text: >-
    the generated page, top down: each journey as a map (entry action, interlockings, the routes they
    choose, the trains they run, continuations and terminal outcomes); the journey's nominal path walked
    end to end as one sequence across its interlockings; every path as a table; each interlocking's
    routes with their guards; each train as a sequence diagram; and a table of what the plan leaves
    unconnected.
- term_id: generated
  text: >-
    byte-for-byte what the installed package renders from the current `plan/`. The output carries no
    timestamp and no package version, so it changes only when the plan (or the renderer) does.
content:
  summary: >-
    A journey page drawn by hand drifts from the plan it describes the moment either changes. Generating
    it, and failing when the committed copy differs, keeps the documented journeys the planned journeys,
    and keeps the plan's gaps (unreached interlockings, open routes, unrouted trains) visible.
  normative_text: |
    The view renders planned behaviour, not acceptance evidence. It is generated so that reviewing a
    decomposition does not require reading interlocking YAML: who hands what to whom, which guard
    selects which route, and where each path ends.

    The gaps table is part of the contract. A plan with interlockings but no journey still gets a page;
    it shows every interlocking as unreached, which is the truthful state of the decomposition.
  fix_hint: |
    Regenerate and commit:

      bun run atdd-bun docs journeys

    If `docs/purpose/journeys/index.adoc` is a hand-written page, move its content elsewhere (the
    generator refuses to overwrite it without --force). Change the plan, never the generated files.
  exceptions:
  - A repository with no `docs/` directory is not in scope.
  - A plan with no journey and no interlocking is not in scope.
metadata:
  aliases:
  - DOCS-JOURNEY-VIEW-001
  severity: 3
  disposition: strict
  introduced_in: 0.4.0
implementation:
  type: validator
  ref: docs_capability
