schema_version: 1.1.0
rule_id: planner.docs.asciidoc-only
kind: rule
status: active
name: AsciiDoc is the only authored format beneath docs/
statement: >-
  A file authored beneath `docs/` MUST be AsciiDoc (`.adoc`). An authored `.md` beneath `docs/`,
  outside the generated `docs/dist/` tree, is a violation. This is the format half of the
  documentation model handoff spec 2 §4 names; it is an EXTENSION obligation because core is
  forbidden to know what a `.adoc` is (companion §4, *Deliberately excluded*).
terms:
- term_id: authored_file
  text: >-
    a file a human wrote and committed beneath `docs/`. The test is location, not content: anything
    under `docs/` that is not under `docs/dist/` is authored.
- term_id: generated_output
  text: >-
    everything beneath `docs/dist/`. It is rendered by the build (spec 2 §7), normally excluded from
    git, and never subject to the authored-format rule.
content:
  summary: >-
    One authored format, mechanically checked. The rule exists because a mixed corpus cannot carry a
    relationship graph: `doc-id` and the `:implements:` / `:supersedes:` edges of
    `planner.docs.graph-target-resolves` are AsciiDoc attributes, and a markdown file has nowhere to
    put them. Format uniformity is the precondition for every other rule in this extension.
  normative_text: |
    The rule is deliberately a LOCATION test rather than a content test. Asking "is this really
    prose documentation?" is semantic and undecidable; asking "is this path under docs/ and not
    under docs/dist/, and does it end .md?" is deterministic and cheap. Spec 2 §4 chose the
    decidable form on purpose, and the same reasoning is why the undeclared-change rule
    (planner.docs.undeclared-change) is stated as the enforceable inverse of "should this have been
    declared?".

    `docs/dist/**` is excluded because it is build output, not authorship. Excluding it by path —
    rather than by gitignore status — keeps the check identical whether or not the tree has been
    built, which is what makes it deterministic in CI.
  fix_hint: |
    Convert the file and keep its content:

      docs/architecture/shared-control-root.md      # ✗ authored markdown under docs/
      docs/architecture/shared-control-root.adoc     # ✓ authored AsciiDoc

    A historical document does not become current by being converted. Convert it INTO
    `docs/archive/` and give it `:status:` accordingly — spec 2 §2 *Out of scope* is explicit that
    migration preserves history and never promotes it.
  exceptions:
  - Everything beneath `docs/dist/` is generated output and is never scanned.
  - Markdown OUTSIDE `docs/` is untouched by this rule. `README.md`, `CONTRIBUTING.md` and the
    repository-root corpus are out of its scope; they are migrated by the adoption step, not
    rejected by this detector.
metadata:
  aliases:
  - DOCS-FORMAT-001
  severity: 2
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: docs_capability
