schema_version: 1.1.0
rule_id: tester.bun.acceptance-binding-declared
kind: rule
status: active
name: Every test declares what it proves
statement: >-
  A test file carrying a URN MUST also declare `// Acceptance: acc:…` or, for a journey/E2E test, `//
  Train: …`. Stack-neutral obligation, Bun-specific detector. Realized by
  `bun_tester_discipline_detector`.
terms:
- term_id: acceptance_binding
  text: >-
    `// Acceptance: acc:…`, naming the obligation this test discharges.
- term_id: train_binding
  text: >-
    `// Train: …` — the alternative for a journey test, which proves a train rather than a
    single acceptance.
content:
  summary: >-
    Requires an `Acceptance:` or `Train:` field beside the URN. Files with no URN are skipped — that
    finding belongs to `test-carries-urn-identity`.
  normative_text: |
    A URN says which test this is; the acceptance binding says which OBLIGATION it discharges. Only the second one closes the loop the gate reads.
    The binding is a claim, not bookkeeping. A syntactically valid Acceptance or Train header is truthful only when the test actually exercises that declared subject and asserts the outcome it requires. Binding a convenient existing acceptance to an unrelated case creates false coverage while satisfying the structural detector.
    Two binding kinds are accepted because a journey test legitimately proves a train rather than a single acceptance. Forcing every test to name an acceptance would push authors to invent one, which pollutes the plan graph with acceptances that exist only to satisfy a linter. The same principle applies in reverse: never select or invent a binding merely to make the test attributable.
  fix_hint: |
    Derive the binding from the plan artifact the test actually proves.

    Claim:
      * identify the declared acceptance whose behavior this file exercises and asserts, or the declared train the journey actually walks.

    Bind:
      * use that exact plan identity in the header:

        // Acceptance: acc:orders:E001-SMOKE-001-renders-row
        // Train: train:orders:checkout-journey

    Avoid:
      * picking any resolvable acceptance merely to satisfy coverage,
      * changing the claimed binding to match a test that proves different behavior,
      * inventing a new acceptance or train solely so an otherwise orphaned test can bind.

    Verify:
      * the test stimulus exercises the bound subject,
      * its behavioral witness proves the bound obligation rather than an adjacent implementation detail.
  exceptions:
  - A `Train:` binding satisfies the rule for journey and E2E tests.
  - Files with no URN are owned by `test-carries-urn-identity`.
  - Whether the named acceptance EXISTS is a plan-graph question this per-file detector cannot answer.
metadata:
  aliases:
  # Bun realization of the core obligation `tester.coverage.every-acceptance-criterion-must`. Core carries no
  # shared alias for it, so the lineage is stated here and in the statement.
  - BUN-ACCEPTANCE-BINDING-DECLARED-001
  severity: 2
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_tester_discipline_detector
