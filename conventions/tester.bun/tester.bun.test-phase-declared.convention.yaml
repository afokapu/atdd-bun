schema_version: 1.1.0
rule_id: tester.bun.test-phase-declared
kind: rule
status: active
name: Every test declares its ATDD phase
statement: >-
  A test file carrying a URN MUST declare `// Phase:` with one of RED, UNIT, SMOKE, E2E. Stack-neutral
  obligation, Bun-specific detector. Realized by `bun_tester_discipline_detector`.
terms:
- term_id: phase_field
  text: >-
    `// Phase:` with RED, UNIT, SMOKE or E2E.
- term_id: phase_gated_rule
  text: >-
    a rule that only applies to one phase. Without a declared phase a test is exempt from the
    whole quality surface by omission.
content:
  summary: >-
    Requires a `Phase:` field from the closed vocabulary.
  normative_text: |
    The phase is not documentation — it is what selects which other rules apply. A RED test must fail first and must assert behaviour; a SMOKE test must assert something operator-observable and must not substitute collaborators. Without a declared phase none of those obligations can be evaluated, so an undeclared test is exempt from the entire quality surface by omission.
    Phase selection is part of the proof contract, not a way to choose the easiest rule set. Declare the phase that matches what the test is actually doing and the proof boundary it exercises. In particular, do not relabel a real-path SMOKE or assembled E2E proof as UNIT merely to permit substitution, and do not label a passing or vacuous case RED merely because a RED marker is easy to add.
    That is why this rule exists separately from the URN rule: a test can be perfectly identified and still be ungoverned or governed by the wrong obligations.
  fix_hint: |
    Derive the phase from the test's actual role; do not choose a weaker label to silence a phase-gated rule.

      // Phase: RED     // the current acceptance proof is intentionally failing first
      // Phase: UNIT    // isolated local behavior
      // Phase: SMOKE   // real assembled path / infrastructure with operator-observable evidence
      // Phase: E2E     // end-to-end journey through the assembled system

    Verify that the declared phase matches the boundary the case really exercises and that the corresponding phase-specific conventions now apply.
  exceptions:
  - Files with no URN are skipped.
  - The vocabulary is fixed by core; a new phase is a core change, not an extension one.
metadata:
  aliases:
  # Bun realization of the core obligation `tester.filename.test-carries-urn-identity`. Core carries no
  # shared alias for it, so the lineage is stated here and in the statement.
  - BUN-PHASE-DECLARED-001
  severity: 2
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_tester_discipline_detector
