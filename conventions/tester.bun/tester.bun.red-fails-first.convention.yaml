schema_version: 1.1.0
rule_id: tester.bun.red-fails-first
kind: rule
status: active
name: RED tests carry a guaranteed-fail marker
statement: >-
  A test whose Phase is RED MUST contain at least one guaranteed-fail marker. Accepted markers,
  transcribed from CORE `red.convention.yaml` -> `red_patterns.typescript`: `throw new Error('Not
  implemented …')`, `throw new UnimplementedError(…)`, `expect(false).toBe(true)`,
  `expect(true).toBe(false)`, `expect.fail(…)`, `return Promise.reject(…)`, and `it.fails(` /
  `test.failing(`. Bun realization of core `tester.red.test-must-fail-first`, mirroring
  `tester.convex.red-fails-first` rule for rule.
terms:
- term_id: red_marker
  text: >-
    a guaranteed-fail construct: throw new Error('Not implemented…'), expect.fail(…),
    expect(false).toBe(true), return Promise.reject(…), it.fails( / test.failing(.
- term_id: structural_proxy
  text: >-
    what this rule checks. Whether a test ACTUALLY fails first is a runtime property; core
    supplies the decidable stand-in.
content:
  summary: >-
    Flags any `Phase: RED` file containing none of the core TypeScript RED markers. `test.failing(` is
    bun:test's spelling of vitest's `it.fails(` and is accepted identically.
  normative_text: |
    Whether a test ACTUALLY fails first is a RUNTIME property no static detector can observe. Core therefore supplies a decidable STRUCTURAL proxy — a guaranteed-fail marker must be present — and that proxy is exactly what this per-stack detector checks. The obligation is agnostic; only the marker syntax is stack-specific.
    The marker is a detector aid, not the RED objective and not the behavioral oracle. A test whose only meaningful reason for failing is `expect.fail(...)`, an unconditional throw before the stimulus, or a failing wrapper around an otherwise passing case is mechanically red while the acceptance remains unproven. The case must also contain the behavioral witness required by `red-behavioral-assertion`.
    The two rules are therefore complementary: `red-behavioral-assertion` asks whether the case encodes the missing behavior; this rule gives the static gate evidence that the artifact is intentionally in RED. The strongest local check is causal: apart from the structural marker, the behavioral witness itself should fail for the expected missing-behavior reason.
  fix_hint: |
    Establish the behavioral oracle first, then add the guaranteed-fail marker required by the static RED gate.

    Behavioral proof:
      * derive the case from the bound acceptance's Given / When / Then,
      * include an assertion that would fail because the required behavior is not implemented correctly.

    Structural proxy:
      * add one accepted RED marker so the static detector can recognize the phase:

        expect.fail("checkout rejection not implemented yet");
        // or
        throw new Error("Not implemented: checkout rejection");

    Avoid:
      * using the marker as the only meaningful reason the test is red,
      * throwing before the declared stimulus is exercised,
      * wrapping a vacuous or already-passing case in `it.fails` / `test.failing`,
      * weakening the behavioral assertion because the marker already guarantees failure.

    Verify:
      * run the target case and confirm it reaches the intended behavior,
      * confirm the behavioral oracle would still fail for the expected reason without relying on the unconditional marker,
      * remove the marker in GREEN only when the behavioral assertion itself carries the proof and passes.
  exceptions:
  - Only RED-phase files are scanned.
  - "`it.fails` / `test.failing` are markers, NOT self-skips — `no-self-skip` deliberately does not flag them."
  - Files with no declared phase are skipped; that is `phase-declared`'s finding.
metadata:
  aliases:
  # Mirrored rule-for-rule from convex.extension.tester.base :: tester.convex.red-fails-first
  # Core obligation: tester.red.test-must-fail-first
  - TESTER-RED-FAILS-FIRST-001
  - BUN-RED-FAILS-FIRST-001
  severity: 3
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_tester_discipline_detector
