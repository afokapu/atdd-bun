schema_version: 1.1.0
rule_id: tester.bun.smoke-no-collaborator-substitution
kind: rule
status: active
name: SMOKE tests do not substitute production collaborators
statement: >-
  A test whose Phase is SMOKE MUST NOT substitute a production collaborator — `mock.module`, `spyOn`,
  `jest.mock`/`spyOn`, `vi.mock`/`spyOn`. Stack-neutral obligation, Bun-specific substitution vocabulary
  (`bun:test` exposes `mock` and `spyOn` where pytest uses `monkeypatch`). Realized by
  `bun_tester_discipline_detector`.
terms:
- term_id: substitution
  text: >-
    mock.module, spyOn, jest.mock/spyOn, vi.mock/spyOn — replacing a production collaborator.
- term_id: false_evidence
  text: >-
    what a substituted SMOKE test gives the gate: credit that the real path works, when the real
    path is precisely what was replaced.
content:
  summary: >-
    Flags any substitution call in a SMOKE-phase file, reporting the exact line.
  normative_text: |
    Substituting a collaborator turns a SMOKE test into a unit test wearing a SMOKE label. The damage is not that the test is bad — it may be an excellent unit test — but that the gate counts it as evidence the real path works, when the real path is precisely the part that was replaced.
    In a SMOKE proof the boundary is part of the claim. The test must enter through the real assembled path and preserve the collaborators whose behavior constitutes that path. Replacing one because it is expensive, inconvenient, or difficult to arrange changes the question the test answers rather than making the same proof cheaper.
    This is the failure that makes a green suite compatible with a broken deployment, which is the specific outcome ATDD's phase separation exists to prevent.
  fix_hint: |
    Preserve the real proof boundary.

    Boundary:
      * exercise the production collaborator through the assembled path required by the SMOKE acceptance,
      * use the real infrastructure or environment that the declared smoke proof is meant to verify.

    Prefer:
      * arrange only the minimum preconditions needed for the declared stimulus,
      * observe the acceptance-specific external result after the real collaborator runs.

    Avoid:
      * replacing the collaborator whose behavior the SMOKE claim depends on,
      * moving the test inward to a unit seam merely because that path is easier to control,
      * relabeling the case as SMOKE after using mocks or spies that bypass production behavior.

    Verify:
      * the case would fail if the real collaborator or production wiring were broken,
      * the observable assertion proves the bound acceptance rather than the test fixture.

    If substitution is the intended proof technique, move that case into a UNIT-phase test where the substitution is honest and expected.
  exceptions:
  - Only SMOKE-phase files are scanned; UNIT tests may substitute freely.
metadata:
  aliases:
  # Bun realization of the core obligation `tester.smoke.no-collaborator-substitution`. Core carries no
  # shared alias for it, so the lineage is stated here and in the statement.
  - BUN-SMOKE-NO-COLLABORATOR-SUBSTITUTION-001
  severity: 4
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_tester_discipline_detector
