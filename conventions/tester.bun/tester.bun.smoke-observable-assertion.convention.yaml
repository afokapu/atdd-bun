schema_version: 1.1.0
rule_id: tester.bun.smoke-observable-assertion
kind: rule
status: active
name: SMOKE tests assert on operator-observable output
statement: >-
  A test whose Phase is SMOKE MUST assert on an operator-observable channel — HTTP response status or
  body, rendered markup, stdout/stderr, exit code — and not only on objects the test constructed itself.
  Stack-neutral obligation, Bun/htmx-specific channel vocabulary. Realized by
  `bun_tester_discipline_detector`.
terms:
- term_id: observable_channel
  text: >-
    an HTTP response status or body, rendered markup, stdout/stderr, an exit code, or persisted
    state.
- term_id: self_constructed_object
  text: >-
    a value the test built itself. Asserting on it proves the constructor works, which is a unit
    test's job under a SMOKE label.
content:
  summary: >-
    Reports a SMOKE case that makes assertions but touches none of the observable channels.
  normative_text: |
    A SMOKE test exists to prove the system does something a person or operator could witness. A case that builds an object and asserts on its fields has proven that the constructor works — which is a unit test's job — while carrying the label that tells the gate real behaviour was exercised.
    Merely touching an observable channel is not enough semantically. The witness must correspond to the bound acceptance's promised outcome. A generic `200` can prove that a server answered while leaving the actual acceptance — for example that the newly created order is visible — completely unproven.
    The observable vocabulary is stack-specific and that is the whole reason this rule is re-realized rather than shared: for this stack the canonical observation is often an HTTP response and the markup inside it, because that markup is what htmx puts in front of the user. The detector recognizes the channel; the convention tells the agent to choose the acceptance-specific evidence on that channel.
  fix_hint: |
    Assert what an operator would observe about the bound acceptance.

    Claim:
      * read the acceptance's Then and identify the externally visible consequence that discharges it.

    Witness:
      * assert on the real HTTP response, rendered markup, stdout/stderr, exit code, persisted state, or other observable channel,
      * make the assertion specific enough that the acceptance behavior disappearing would turn the case red.

      const order = buildOrder({ sku: "x" });
      expect(order.sku).toBe("x");                     // internal; not SMOKE evidence

      const res = await fetch("/orders");
      expect(res.status).toBe(200);                    // useful transport evidence
      expect(await res.text()).toContain("order-1");   // acceptance-specific observable witness

    Avoid:
      * treating any observable assertion as sufficient when it does not prove the declared outcome,
      * asserting only on objects the test constructed itself,
      * checking internal calls or mocks instead of the resulting system behavior.

    Verify:
      * the real path was exercised,
      * the witness would fail if the bound acceptance behavior regressed.
  exceptions:
  - Only SMOKE-phase files are scanned.
  - Cases with no assertions are skipped — other rules own that.
metadata:
  aliases:
  # Bun realization of the core obligation `tester.smoke.operator-observable-assertion`. Core carries no
  # shared alias for it, so the lineage is stated here and in the statement.
  - BUN-SMOKE-OBSERVABLE-ASSERTION-001
  severity: 3
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_tester_discipline_detector
