schema_version: 1.1.0
rule_id: tester.htmx.train-e2e-coverage
kind: rule
status: active
name: Every declared train has a browser spec
statement: Every train declared under `plan/` MUST have at least one journey spec bound to it by `// Train:`. Bun/htmx
  realization of `tester.vite.train-e2e-coverage`, strict.
terms:
- term_id: browser_spec
  text: a `*.e2e.ts` file run by Playwright, or any test file carrying a journey marker (`// Train:`, `// Journey:`,
    `test:train:`, `test:journey:`), so a misnamed one is still judged.
content:
  summary: Every declared train has a browser spec.
  normative_text: 'A train with no browser spec is a silent gap: the journey it declares can regress with nothing
    turning red.'
  fix_hint: 'Add `e2e/<train-slug>.e2e.ts` bound with `// Train: <train id>`.'
  exceptions:
  - Vendored and generated trees (`node_modules`, `dist`, `build`, `_generated`) are never scanned.
  - The rule reports at the train's plan file, where the gap was declared.
metadata:
  aliases:
  - BUN-E2E-TRAIN-E2E-COVERAGE-001
  severity: 3
  disposition: strict
  introduced_in: 0.5.0
  mirrors: tester.vite.train-e2e-coverage
implementation:
  type: validator
  ref: htmx_e2e_detector
