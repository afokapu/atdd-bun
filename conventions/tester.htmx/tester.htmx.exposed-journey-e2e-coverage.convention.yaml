schema_version: 1.1.0
rule_id: tester.htmx.exposed-journey-e2e-coverage
kind: rule
status: active
name: Every exposed journey has an E2E or SMOKE browser spec
statement: Every journey whose entrypoint is exposed MUST have at least one journey spec bound to it by `// Journey:`
  with an E2E or SMOKE test URN. New in the Bun/htmx browser tester, strict.
terms:
- term_id: browser_spec
  text: 'a `*.e2e.ts` file run by Playwright, or any test file whose header comments carry a journey marker (`//
    Train:`, `// Journey:`, `// URN: test:train:…`, `// URN: test:journey:…`), so a misnamed one is still judged.
    A unit test that merely mentions a journey URN in a string is not one.'
content:
  summary: Every exposed journey has an E2E or SMOKE browser spec.
  normative_text: An exposed journey is what a user can start. The route-level rules prove each routing decision;
    this proves the journey runs end to end in a browser.
  fix_hint: 'Add `e2e/<journey>.smoke.e2e.ts` bound with `// Journey: <journey id>`.'
  exceptions:
  - Vendored and generated trees (`node_modules`, `dist`, `build`, `_generated`) are never scanned.
  - Internal journeys (entrypoint not exposed) are out of scope.
metadata:
  aliases:
  - BUN-E2E-EXPOSED-JOURNEY-E2E-COVERAGE-001
  severity: 3
  disposition: strict
  introduced_in: 0.5.0
implementation:
  type: validator
  ref: htmx_e2e_detector
