schema_version: 1.1.0
rule_id: atdd-bun.topology.e2e-location
kind: rule
status: active
name: Every interlocking route and exposed journey has an end-to-end test at its canonical path
statement: 'Every interlocking route has `<e2e_root>/interlockings/<interlocking>/<route>.routes.test.ts`, and every
  exposed journey `<e2e_root>/journeys/<journey>.journey.test.ts`, each carrying a `test:{wagon}:{feature}:{acceptance}`
  URN for a declared feature and binding `Acceptance: acc:{wagon}:{acceptance}` declared by a WMBT. On an exposed
  journey whose surfaces include `frontend`, a Playwright spec (`*.e2e.ts`) bound to the route''s train or the journey
  substitutes for the Bun test. Package rule, strict.'
terms:
- term_id: package_rule
  text: 'a rule of this package''s own gates (`atdd-bun.*`), realized by a package guard rather than a canonical
    planner node. It is held to the same per-rule checks as every convention: a convention, strict, a failing fixture,
    relationship edges.'
- term_id: topology_settings
  text: the `topology:` keys `plan_root`, `source_root`, `test_root`, `e2e_root` in `atdd-bun.yaml` (defaults `plan`,
    `src/wagons`, `tests/wagons`, `e2e`).
content:
  summary: Every interlocking route and exposed journey has an end-to-end test at its canonical path.
  normative_text: 'One behaviour, one end-to-end proof at a path derived from the plan: a missing proof is found
    by path, not by searching.'
  fix_hint: Add the test at the path the finding names, or, on a frontend journey, a Playwright spec bound with
    `// Train:` or `// Journey:`.
  exceptions:
  - Vendored and generated trees (`node_modules`, `dist`, `build`, `_generated`) are never scanned.
metadata:
  aliases:
  - ATDD-BUN-TOPOLOGY-E2E-LOCATION
  severity: 3
  disposition: strict
  introduced_in: 0.6.0
implementation:
  type: validator
  ref: atdd_topology
