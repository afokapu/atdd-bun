schema_version: 1.1.0
rule_id: coder.bun.quality-comments
kind: rule
status: active
name: TypeScript files carry at least a 10% comment ratio
statement: >-
  Every TypeScript/TSX file MUST have a comment ratio of at least 10% of non-blank lines. Stack-neutral
  obligation, NATIVE BUN detector transcribed from the python-pytest sibling `coder.refactor.quality-
  comments-typescript` and verified numerically identical. Realized by `bun_ts_metrics_detector` (core
  alias REFACTOR-QUALITY-COMMENTS-TS-001).
terms:
- term_id: comment_ratio
  text: >-
    comment lines over non-blank lines, counting line comments, block comments and `*`
    continuations.
- term_id: floor_against_absence
  text: >-
    what this rule is. It cannot tell a good comment from a bad one; it catches the file that
    documents nothing.
content:
  summary: >-
    Counts line comments, block comments and continuation lines beginning `*` against all non-blank lines.
  normative_text: |
    A ratio is a blunt instrument for a quality that is not quantitative, and it is used here for one narrow reason: a file with NO comments at all is common and is almost always a file whose non-obvious decisions were never written down. Ten percent is low enough that any file with a real header and a few explanatory lines clears it.
    The rule cannot tell a good comment from a bad one. It is a floor against absence, not a measure of quality, and it should not be read as encouragement to restate code in prose.
    Treat the ratio as a sensor for missing design context, not as a prose quota. A successful repair leaves future readers with information the code itself cannot communicate; filler text that merely increases the numerator satisfies the arithmetic while making the source worse.
  fix_hint: |
    Find the decisions and constraints that are currently invisible to a reader.

    Diagnose:
      * identify why the module exists and which responsibility it owns,
      * identify non-obvious invariants, upstream constraints, compatibility choices, or failure semantics,
      * identify places where the obvious implementation was intentionally not chosen.

    Prefer:
      * document why a design choice exists, what invariant a block preserves, or which external constraint forces the shape,
      * use a concise module or GREEN header when it communicates real purpose and runtime context,
      * place explanation next to the decision it clarifies.

    Avoid:
      * comments that simply restate the next line of code,
      * filler, generated prose, repeated headings, or artificially split comment lines added to raise the ratio,
      * commenting out dead code instead of deleting it,
      * changing otherwise cohesive code solely to manipulate the denominator.

    Verify:
      * every added comment conveys information not already obvious from the code,
      * stale or misleading comments are not introduced,
      * the comment-ratio finding is gone,
      * behavior remains unchanged and tests stay green,
      * the refactor introduces no new ATDD Bun violations.
  exceptions:
  - Blank lines are excluded from both numerator and denominator.
  - Continuation lines beginning `*` inside a block comment count as comment lines.
  - Test files and vendored/build directories are outside the scan.
metadata:
  aliases:
  # REFACTOR-QUALITY-COMMENTS-TS-001 is the SHARED core alias, also carried by the agnostic node and by
  # its python-pytest realization. One obligation, two detectors, two runtimes.
  - REFACTOR-QUALITY-COMMENTS-TS-001
  severity: 2
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_ts_metrics_detector
