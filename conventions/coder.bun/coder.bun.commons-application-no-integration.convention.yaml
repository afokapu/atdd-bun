schema_version: 1.1.0
rule_id: coder.bun.commons-application-no-integration
kind: rule
status: active
name: Commons application modules do not import integration
statement: >-
  A module under a `commons/application/` or `shared/application/` tree MUST NOT import from the commons
  `integration/` layer. Bun realization mirroring `coder.convex.commons-application-no-integration`; core
  obligation `coder.commons.domain-layer-purity`.
terms:
- term_id: commons_application
  text: >-
    a module under `commons/application/` or `shared/application/` — orchestration over ports it
    defines.
- term_id: inverted_dependency
  text: >-
    reaching into integration from application, which welds orchestration to a specific
    transport.
content:
  summary: >-
    Flags an import from a commons application module that resolves into the integration layer.
  normative_text: |
    The application layer orchestrates through ports it defines. Reaching into integration inverts the dependency and welds orchestration to a specific transport, so changing the transport changes the orchestration.
  fix_hint: |
    Define the port in `application/` and let `integration/` implement it; the composition root supplies the implementation.
  exceptions:
  - Test files and vendored/build directories are never scanned.
  - Bare npm specifiers resolve outside the project graph and are not layer-checked.
  - A file carrying no layer segment is outside these rules rather than in violation of them.
metadata:
  aliases:
  # Mirrored rule-for-rule from coder.convex.commons-application-no-integration
  # Core obligation: coder.commons.domain-layer-purity
  - BUN-COMMONS-APPLICATION-NO-INTEGRATION-001
  severity: 3
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_clean_architecture_detector
