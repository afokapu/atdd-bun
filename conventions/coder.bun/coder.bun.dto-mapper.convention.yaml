schema_version: 1.1.0
rule_id: coder.bun.dto-mapper
kind: rule
status: active
name: DTO mappers live in integration/
statement: >-
  A function mapping between a DTO and a domain entity (`to*DTO`, `from*DTO`, `map*DTO*`) MUST live in the
  `integration/` layer. Bun realization mirroring `coder.convex.dto-mapper`; core obligation
  `coder.dto.mapper`.
terms:
- term_id: dto_mapper
  text: >-
    a function translating between a DTO and a domain entity: `to*DTO`, `from*DTO`, `map*DTO*`.
- term_id: translation_layer
  text: >-
    integration — where a boundary crossing legitimately sees both sides.
content:
  summary: >-
    Flags a DTO-mapper function declared in any layer other than integration.
  normative_text: |
    Mapping is translation across a boundary, which is precisely what the integration layer is for. A mapper in the domain drags the wire format inward; a mapper in presentation duplicates itself once a second caller appears.
  fix_hint: |
    Canonical path:
      * keep DTO-to-domain and domain-to-DTO translation in the integration layer where both shapes are legitimately visible.
    
    During GREEN:
      * reuse an existing mapper for the same boundary when one exists,
      * add only the field mapping required by the current acceptance,
      * create a new mapper only for a genuinely new boundary translation.
    
    Do not broaden:
      * do not move domain behavior into the mapper,
      * do not migrate unrelated mappings,
      * do not place translation in presentation or domain as a shortcut.
    
    Prove:
      * the current behavioral acceptance passes,
      * the mapper lives in integration and preserves the intended boundary.
  exceptions:
  - Test files and vendored/build directories are never scanned.
  - Bare npm specifiers resolve outside the project graph and are not layer-checked.
  - A file carrying no layer segment is outside these rules rather than in violation of them.
metadata:
  aliases:
  # Mirrored rule-for-rule from coder.convex.dto-mapper
  # Core obligation: coder.dto.mapper
  - BUN-DTO-MAPPER-001
  severity: 3
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_clean_architecture_detector
