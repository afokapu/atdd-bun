schema_version: 1.1.0
rule_id: coder.bun.complexity-nesting
kind: rule
status: active
name: TypeScript function nesting depth stays at or below 4
statement: >-
  Every TypeScript/TSX function MUST keep its maximum control-flow nesting depth at or below 4. Stack-
  neutral obligation, NATIVE BUN detector transcribed from the python-pytest sibling
  `coder.refactor.complexity-nesting-typescript` and verified numerically identical. Realized by
  `bun_ts_metrics_detector` (core alias COMPLEXITY-NESTING-TS-001).
terms:
- term_id: control_depth
  text: >-
    the maximum brace depth reached on lines carrying a control keyword, measured relative to
    the function's own base depth.
- term_id: guard_clause
  text: >-
    an inverted condition returning early. The usual way to remove a level without changing
    behaviour.
content:
  summary: >-
    Depth is measured by brace balance on lines that also carry a control keyword (if / else / for / while
    / do / switch / try / catch / finally), relative to the function's own base depth.
  normative_text: |
    Nesting is the metric readers feel most directly: at depth five a reader must hold five simultaneous conditions to know whether a line executes, which is past what working memory does reliably.
    It is also the most mechanically fixable — a guard clause or an extracted helper usually removes a level without changing behaviour, which is why the threshold is enforced rather than advised.
    Treat excessive depth as a sensor for too much conditional context being carried at once. The objective is to make the execution conditions easier to understand, not merely to remove braces or encode the same nesting in expressions the metric counts differently.
  fix_hint: |
    Flatten the control flow by removing unnecessary conditional context.

    Diagnose:
      * identify conditions that reject work early and can become guards,
      * identify an inner block that performs one cohesive operation,
      * identify nested iteration that can be expressed as preparation followed by one clear pass.

    Prefer:
      * invert conditions into early-return guard clauses when doing so preserves cleanup, error, and ordering semantics,
      * extract a cohesive inner operation into a named function with a small, meaningful input,
      * prepare or filter a collection before iterating when that makes the algorithm clearer.

    Avoid:
      * converting statements into clever boolean or ternary expressions solely to evade the depth count,
      * extracting an inner block that requires a long parameter list or still depends on the caller's hidden conditional context,
      * duplicating cleanup, logging, or error handling across new guard clauses,
      * changing evaluation order or exception behavior while flattening the function.

    Verify:
      * existing behavior and tests remain green, including error and boundary paths,
      * the triggering nesting violation is gone,
      * the flattened flow reads with fewer simultaneous preconditions,
      * extracted functions satisfy the applicable length and complexity conventions,
      * the refactor introduces no new ATDD Bun violations.
  exceptions:
  - Functions with fewer than 3 code lines are not scored.
  - Comment lines are ignored when measuring brace balance.
  - Test files and vendored/build directories are outside the scan.
metadata:
  aliases:
  # COMPLEXITY-NESTING-TS-001 is the SHARED core alias, also carried by the agnostic node and by
  # its python-pytest realization. One obligation, two detectors, two runtimes.
  - COMPLEXITY-NESTING-TS-001
  severity: 3
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_ts_metrics_detector
