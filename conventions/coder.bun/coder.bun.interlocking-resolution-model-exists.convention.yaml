schema_version: 1.1.0
rule_id: coder.bun.interlocking-resolution-model-exists
kind: rule
status: active
name: Interlocking route resolution returns structured metadata, not a bare trainId (Bun)
statement: >-
  An `InterlockingRunner.resolveTrain(...)` MUST resolve a structured `InterlockingResolution` model
  carrying the route metadata — not a bare `trainId` string. The model MUST define the fields
  `interlockingId`, `routeId`, `trainId`, `trainPath`, `category`, `guardId`, `resolutionStrategy`, and
  `reason`. This is the Bun-stack realization of the agnostic core obligation
  `coder.train.interlocking-resolution-model-exists` (core afokapu/atdd#1251); the JS detector that
  enforces it is the atdd.workspace.bun implementation referenced below.
implementation:
  type: validator
  ref: coder.bun.interlocking-resolution-model-exists
content:
  summary: >-
    An agnostic "structured route resolution" obligation, rendered for the Bun application. The JS
    realization scans `src/trains/**/*.ts`: when an `InterlockingRunner` exposes `resolveTrain`, an
    `InterlockingResolution` type/interface/class defining the eight required fields MUST exist;
    otherwise the route is resolved as a bare trainId. Member of the `bun_interlocking_infrastructure`
    FAMILY detector (checks/interlocking_resolution_model.mjs).
  normative_text: |
    Core runtime spec afokapu/atdd#1251 suggests the resolution model. For the Bun/TS stack:

        export interface InterlockingResolution {
          interlockingId: string; routeId: string; trainId: string; trainPath: string;
          category: string; guardId: string; resolutionStrategy: string; reason: string;
        }

    A bare trainId string loses the routeId, guardId, category, resolutionStrategy, trainPath, and
    the human-readable reason needed for trace and projection equivalence. Category agreement is
    judged against the target train's `category` FIELD, never a digit parsed out of the identity
    validation. WHICH runtime files are inspected and HOW the model fields are recognized is the
    per-stack detector's concern (Bun: collecting the InterlockingResolution property names).
  fix_hint: |
    Define the structured model and return it from resolveTrain:

      return {
        interlockingId, routeId, trainId, trainPath,
        category, guardId, resolutionStrategy, reason,
      };

    This rule is `strict`: a resolveTrain backed only by a bare trainId is not suppressible and fails CI.
  exceptions:
    - Applies only when an `InterlockingRunner` with a `resolveTrain` method is present (a missing
      runner/method is the separate `coder.bun.interlocking-runner-exists` concern).
metadata:
  aliases:
    - BUN-INTERLOCKING-RESOLUTION-MODEL-001
  severity: 4
  disposition: strict
  introduced_in: 0.1.0
  core_design_refs:
    - afokapu/atdd#1246
    - afokapu/atdd#1251
terms:
  - term_id: interlocking_resolution_model
    text: >-
      the `InterlockingResolution` structure returned by resolveTrain, carrying interlockingId, routeId,
      trainId, trainPath, category, guardId, resolutionStrategy, reason.
