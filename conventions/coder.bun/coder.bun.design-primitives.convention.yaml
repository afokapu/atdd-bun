schema_version: 1.1.0
rule_id: coder.bun.design-primitives
kind: rule
status: active
name: App components compose design-system primitives for interactive controls
statement: An app component (`.tsx`/`.jsx` outside the design root) MUST render interactive controls through a design-system
  primitive rather than a raw `<button>`, `<input>`, `<select>`, or `<textarea>`, so controls stay themed, accessible,
  and consistent. Bun realization of `coder.design.primitives`, mirroring `coder.vite.design-primitives`.
terms:
- term_id: design_root
  text: 'a directory named `design`, `design_system`, or `design-system`. The first directory beneath it names the
    layer: `tokens` or `foundations`, `primitives`, `components`, `templates`. A repository with no design root
    is not judged (self-scoping): there is no system to connect to yet.'
- term_id: raw_control
  text: a lowercase `<button`, `<input`, `<select`, or `<textarea` element written in app code.
content:
  summary: Flags raw interactive platform elements in component source outside the design root.
  normative_text: Controls are where focus, disabled, error, and loading states live. Each raw control re-implements
    them, and each re-implementation diverges.
  fix_hint: |
    Canonical path:
      * render interactive controls through the existing design-system primitive and pass required htmx or DOM attributes through it.
    
    During GREEN:
      * reuse the primitive that already represents the control,
      * extend only the smallest prop or attribute surface required by the current interaction,
      * create a new primitive only when no existing primitive represents the control correctly.
    
    Do not broaden:
      * do not restyle or migrate unrelated controls,
      * do not bypass the primitive with raw interactive markup just to pass the acceptance,
      * do not add generic props that the current behavior does not need.
    
    Prove:
      * the interaction acceptance passes,
      * the rendered interactive control comes through the design-system primitive.
  exceptions:
  - Test files (`*.test.*`, `*.spec.*`) and vendored/build directories are never scanned.
  - The design system's own primitives render the raw elements and are not scanned.
  - Plain `.html` templates cannot import components and are out of scope.
metadata:
  aliases:
  - BUN-DESIGN-PRIMITIVES-001
  core_obligation: coder.design.primitives
  severity: 2
  disposition: strict
  introduced_in: 0.2.0
implementation:
  type: validator
  ref: bun_design_system_detector
