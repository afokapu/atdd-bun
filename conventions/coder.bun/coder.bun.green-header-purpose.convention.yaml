schema_version: 1.1.0
rule_id: coder.bun.green-header-purpose
kind: rule
status: active
name: The header states the file's purpose in one line
statement: >-
  Every implementation file MUST carry a `Purpose:` description of at most 80 characters. Stack-neutral
  obligation, Bun-specific detector; realized by `bun_green_traceability_detector` (core alias GREEN-
  HEADER-002).
terms:
- term_id: purpose_line
  text: >-
    a single `Purpose:` line of at most 80 characters stating the file's one job.
- term_id: length_cap
  text: >-
    the 80-character limit. It forces one job to be named, and a purpose that will not fit is
    evidence the file has more than one.
content:
  summary: >-
    A "one-line purpose" obligation: present, and 80 characters or fewer.
  normative_text: |
    The 80-character cap is the whole rule. An unbounded field becomes a paragraph, a paragraph goes stale, and a stale paragraph is worse than no description because it is believed. A single line that must fit forces the author to name the file's one job — and a file whose job will not fit in 80 characters is usually a file doing more than one thing, which makes this a design signal as much as a documentation rule.
  fix_hint: |
    Canonical path:
      * state the file's one actual job in a single `Purpose:` line of at most 80 characters.
    
    During GREEN:
      * derive the purpose from the responsibility introduced for the current acceptance,
      * use concrete responsibility language rather than implementation mechanics,
      * if the purpose genuinely cannot fit because the new file owns multiple jobs, split only the responsibilities required by the current behavior.
    
    Do not broaden:
      * do not invent a vague purpose just to meet the length cap,
      * do not perform unrelated decomposition,
      * do not describe hypothetical future responsibilities.
    
    Prove:
      * the current behavioral acceptance passes,
      * the purpose truthfully names one job and fits the limit.
  exceptions:
  - Exactly 80 characters passes; 81 does not.
  - A missing description is reported at the URN line.
  - Test files are excluded.
metadata:
  aliases:
  # GREEN-HEADER-002 is the SHARED core alias — the same one carried by the Python
  # realization and by coder.vite.green-header-purpose. One obligation, three
  # per-stack detectors, found through this alias.
  - GREEN-HEADER-002
  - BUN-GREEN-HEADER-PURPOSE-001
  severity: 2
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_green_traceability_detector
