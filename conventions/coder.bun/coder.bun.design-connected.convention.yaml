schema_version: 1.1.0
rule_id: coder.bun.design-connected
kind: rule
status: active
name: Every rendering app component is connected to the design system
statement: An app component (`.tsx`/`.jsx` outside the design root) that renders markup MUST import at least one
  design-system element — token, primitive, component, or template — so no UI surface is disconnected from the shared
  system. Bun realization of `coder.design.orphan-ui`.
terms:
- term_id: design_root
  text: 'a directory named `design`, `design_system`, or `design-system`. The first directory beneath it names the
    layer: `tokens` or `foundations`, `primitives`, `components`, `templates`. A repository with no design root
    is not judged (self-scoping): there is no system to connect to yet.'
- term_id: rendering_component
  text: a component source file whose code (literals and comments masked) contains a closing tag or a self-closing
    element.
content:
  summary: Flags rendering component files outside the design root that import nothing from it.
  normative_text: A screen built without the system is where the next one-off style lands. Requiring one design
    import makes the connection explicit and reviewable.
  fix_hint: |
    Canonical path:
      * compose application UI from the existing design-system template, component, or primitive that owns the required role.
    
    During GREEN:
      * reuse the nearest existing design-system surface before creating a new one,
      * add only the connection required by the current rendered behavior,
      * if no suitable surface exists, introduce the smallest design-system component that expresses the current need.
    
    Do not broaden:
      * do not redesign the screen or migrate unrelated markup,
      * do not create a generic component library for hypothetical callers,
      * do not add a meaningless import merely to satisfy connectivity.
    
    Prove:
      * the current behavioral or rendering acceptance passes,
      * the rendered app component is genuinely composed from the design system.
  exceptions:
  - Test files (`*.test.*`, `*.spec.*`) and vendored/build directories are never scanned.
  - Non-rendering modules (routes, handlers, data) are not judged.
metadata:
  aliases:
  - BUN-DESIGN-CONNECTED-001
  core_obligation: coder.design.orphan-ui
  severity: 2
  disposition: strict
  introduced_in: 0.2.0
implementation:
  type: validator
  ref: bun_design_system_detector
