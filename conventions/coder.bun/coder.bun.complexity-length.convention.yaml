schema_version: 1.1.0
rule_id: coder.bun.complexity-length
kind: rule
status: active
name: TypeScript functions stay at or below 50 code lines
statement: >-
  Every TypeScript/TSX function MUST be at most 50 lines of code, excluding blank and comment lines.
  Stack-neutral obligation, NATIVE BUN detector transcribed from the python-pytest sibling
  `coder.refactor.complexity-length-typescript` and verified numerically identical. Realized by
  `bun_ts_metrics_detector` (core alias COMPLEXITY-LENGTH-TS-001).
terms:
- term_id: code_line
  text: >-
    a line inside the function body that is neither blank nor a comment.
- term_id: internal_seam
  text: >-
    a boundary inside a long function, usually marked by the comment introducing each block.
    Each is a candidate helper whose comment is its name.
content:
  summary: >-
    Counts non-blank, non-comment lines between the function's signature and its matching closing brace,
    found by a string- and comment-aware brace matcher so a `}` inside a string never closes a body early.
  normative_text: |
    Length is the crudest of the three per-function metrics and the hardest to argue with: a function longer than a screen cannot be read as one unit, so it is read in fragments and its invariants are reconstructed from memory each time.
    It catches a different fault from complexity. A long function may be perfectly linear — fifty sequential assignments score 1 on cyclomatic complexity — and still be doing five things that wanted names.
    Treat the threshold as a sensor for weak cohesion or multiple responsibilities, not as the design objective. A successful refactor identifies a responsibility or cohesive operation that deserves its own name and boundary. Merely moving enough contiguous lines elsewhere to cross the threshold removes the signal without repairing the smell.
  fix_hint: |
    Diagnose the design problem before changing the code.

    Diagnose:
      * identify the distinct responsibilities, stages, or invariants managed by the function,
      * look for semantic seams: blocks that can be described by one intention-revealing name,
      * identify the data each candidate responsibility actually needs.

    Prefer:
      * extract one cohesive responsibility at a time,
      * name helpers after the purpose they perform rather than the mechanics they contain,
      * keep related state and decisions together,
      * leave the original function as a readable description of the top-level flow.

    Avoid:
      * splitting at an arbitrary line boundary merely to satisfy the 50-line limit,
      * helpers such as `part1`, `processRest`, `buildLinesAndTotal`, or equivalent names that expose extraction mechanics rather than responsibility,
      * moving a long or complex block unchanged into another function,
      * introducing a generalized abstraction unrelated to the responsibility being extracted.

    Verify:
      * existing behavior and tests remain green,
      * the triggering length violation is gone,
      * extracted functions satisfy the applicable complexity and nesting conventions,
      * the resulting names and boundaries make the responsibilities easier to understand,
      * the refactor introduces no new ATDD Bun violations.
  exceptions:
  - Blank lines and comment lines are not counted.
  - Test files and vendored/build directories are outside the scan.
metadata:
  aliases:
  # COMPLEXITY-LENGTH-TS-001 is the SHARED core alias, also carried by the agnostic node and by
  # its python-pytest realization. One obligation, two detectors, two runtimes.
  - COMPLEXITY-LENGTH-TS-001
  severity: 2
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_ts_metrics_detector
