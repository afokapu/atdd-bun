schema_version: 1.1.0
rule_id: coder.bun.composition-consumer
kind: rule
status: active
name: Consumer layers receive their collaborators
statement: >-
  A module in the `presentation/` or `application/` layer MUST receive its collaborators by injection
  rather than constructing them. Bun realization mirroring `coder.convex.composition-consumer`; core
  obligation `coder.refactor.composition-consumer`.
terms:
- term_id: consumer_layer
  text: >-
    presentation or application — a layer that USES collaborators rather than assembling them.
- term_id: injection
  text: >-
    receiving a collaborator as a parameter or pre-wired. A consumer that builds its own cannot
    be tested without them.
content:
  summary: >-
    Flags a `new <Collaborator>()` inside a consumer layer.
  normative_text: |
    The sibling of `composition-root`, and the half that makes the discipline pay. That rule says where wiring MAY happen; this one says consumers must accept what they are given.
    A consumer that builds its own collaborators cannot be tested without them — which is exactly how a unit test acquires a database.
  fix_hint: |
    Take the collaborator as a parameter, and let the composition root supply it.
  exceptions:
  - Test files and vendored/build directories are never scanned.
  - Bare npm specifiers resolve outside the project graph and are not layer-checked.
  - A file carrying no layer segment is outside these rules rather than in violation of them.
metadata:
  aliases:
  # Mirrored rule-for-rule from coder.convex.composition-consumer
  # Core obligation: coder.refactor.composition-consumer
  - BUN-COMPOSITION-CONSUMER-001
  severity: 3
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_clean_architecture_detector
