schema_version: 1.1.0
rule_id: coder.bun.complexity-cyclomatic
kind: rule
status: active
name: TypeScript function cyclomatic complexity stays at or below 10
statement: >-
  Every TypeScript/TSX function MUST keep its cyclomatic complexity at or below 10, so the number of
  independent paths through any one function stays testable. Stack-neutral obligation, NATIVE BUN
  detector: the thresholds and the counting rule are transcribed from the python-pytest sibling
  `coder.refactor.complexity-cyclomatic-typescript` and verified to produce identical numbers, so this
  repo enforces its own metrics without a Python interpreter. Realized by `bun_ts_metrics_detector` (core
  alias COMPLEXITY-CYCLOMATIC-TS-001).
terms:
- term_id: decision_point
  text: >-
    a construct adding an independent path: if / else if / for / while / do / catch / case, a
    `&&` / `||` / `??`, or a ternary.
- term_id: trivial_function
  text: >-
    a function under three code lines. Not scored, because a two-line arrow is not a complexity
    problem.
content:
  summary: >-
    Complexity is 1 plus each decision keyword (if / else if / for / while / do / catch / case), each
    boolean or nullish operator (&& / || / ??) and each ternary. Functions under 3 code lines are skipped.
  normative_text: |
    The obligation and its arithmetic are unchanged from the Python realization — deliberately, because a repo that switches providers must not see its numbers move. What changes is only WHO runs the count.
    Cyclomatic complexity is a proxy for how many test cases a function needs before its behaviour is pinned. Above roughly ten paths, complete coverage stops being written, and the untested paths are where defects settle.
    Treat the score as a sensor for too many independent decisions inside one responsibility, not as an invitation to disguise branching. A useful refactor makes the decision structure easier to name, test, and reason about; moving the same decision tree behind another call or encoding it opaquely only hides the signal.
  fix_hint: |
    Diagnose which decisions belong together before reducing the score.

    Diagnose:
      * group branches by the policy or responsibility they implement,
      * distinguish validation and guard conditions from the core operation,
      * identify repeated compound conditions that represent a domain predicate.

    Prefer:
      * extract a coherent decision or policy into an intention-revealing function,
      * replace repeated compound conditions with well-named predicates,
      * use a dispatch table or strategy only when the domain genuinely represents a stable mapping from a key to behavior,
      * keep the caller's control flow readable enough to reveal the important choices.

    Avoid:
      * moving the same branch tree unchanged into a generically named helper,
      * replacing readable control flow with indirect data structures solely to lower the measured score,
      * scattering one policy across many tiny functions whose interaction is harder to follow than the original,
      * changing boolean semantics, branch order, or fallback behavior while refactoring.

    Verify:
      * existing behavior and path-focused tests remain green,
      * the triggering complexity violation is gone,
      * extracted code does not create a new nesting, duplication, or length violation,
      * the resulting decision boundaries correspond to meaningful responsibilities,
      * the refactor introduces no new ATDD Bun violations.
  exceptions:
  - Functions with fewer than 3 code lines are not scored.
  - Test files and vendored/build directories are outside the scan.
metadata:
  aliases:
  # COMPLEXITY-CYCLOMATIC-TS-001 is the SHARED core alias, also carried by the agnostic node and by
  # its python-pytest realization. One obligation, two detectors, two runtimes.
  - COMPLEXITY-CYCLOMATIC-TS-001
  severity: 3
  # strict: atdd-bun fails on every finding; it has no advisory mode and no ratchet baseline.
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_ts_metrics_detector
