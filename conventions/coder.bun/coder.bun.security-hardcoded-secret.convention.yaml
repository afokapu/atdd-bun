schema_version: 1.1.0
rule_id: coder.bun.security-hardcoded-secret
kind: rule
status: active
name: No secret literals in source
statement: >-
  Source MUST NOT contain a secret literal — an AWS access key id, a PEM private-key header, or a password
  / api-key / token assigned a literal string. Stack-neutral obligation, and one of only two rules in this
  family that PORTS verbatim: the five patterns in the python-pytest sibling `coder.security.hardcoded-
  secret` are language-neutral, because `password = "..."` and a PEM header look identical in Python and
  TypeScript. Realized by `bun_security_hygiene_detector` (core alias SECURITY-HARDCODED-SECRET-001).
terms:
- term_id: secret_literal
  text: >-
    a credential written into source: an AWS key id, a PEM private-key header, or a password /
    api-key / token assigned a literal string.
- term_id: rotation_not_deletion
  text: >-
    the actual remedy. Git keeps a committed secret, so removing the line does not fix it.
content:
  summary: >-
    Scans source and templates for the five transcribed secret patterns. `.example` / `.sample` /
    `.template` files are documentation and are skipped.
  normative_text: |
    A committed secret is not fixed by deleting it, because git keeps it. It is fixed by ROTATING it, which is why detection has to happen before the commit rather than in review.
    The rule reads assignment shape rather than entropy, so it catches the realistic case — someone pasting a working key to get unblocked — and deliberately does not attempt to judge whether a random-looking string is secret.
  fix_hint: |
    Move the value to the environment and read it at the edge:

      const apiKey = "sk_live_0123456789abcdef";   // wrong
      const apiKey = process.env.API_KEY;            // right

    If the literal was ever committed, rotate it — removing the line is not enough.
  exceptions:
  - "`.example`, `.sample` and `.template` files are placeholders, not secrets."
  - Vendored and build directories are never scanned.
  - Values read from `process.env` are never literals and are not matched.
metadata:
  aliases:
  # SECURITY-HARDCODED-SECRET-001 is the SHARED core alias, also carried by the agnostic node and its
  # python-pytest realization.
  - SECURITY-HARDCODED-SECRET-001
  severity: 4
  # PORTED verbatim from the python-pytest sibling — the pattern is
  # language-neutral, so both providers produce the same findings.
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: bun_security_hygiene_detector
