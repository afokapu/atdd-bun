schema_version: 1.1.0
rule_id: coder.bun.responsive-no-fixed-width
kind: rule
status: active
name: No width or min-width wider than the smallest viewport
statement: A `width` or `min-width` declaration, in a stylesheet, a `<style>` block, a `style` attribute or a JSX
  `style` object, MUST NOT exceed (with `rem` and `em` counted at 16px) the smallest viewport declared under `frontend.viewports`
  in `atdd-bun.yaml` (default 375px). New in atdd-bun, strict.
terms:
- term_id: frontend_settings
  text: '`atdd-bun.yaml` → `frontend.viewports` (the widths responsive specs render at; the smallest bounds fixed
    widths) and `frontend.breakpoints` (the widths media queries may use).'
content:
  summary: No width or min-width wider than the smallest viewport.
  normative_text: An element wider than the screen forces horizontal scrolling on every phone. Wide layouts are
    expressed with `max-width`, percentages, or layouts that wrap.
  fix_hint: |
    Canonical path:
      * make content fluid at small viewports, usually with `width: 100%` plus an appropriate `max-width` rather than an oversized fixed `width` or `min-width`.
    
    During GREEN:
      * fix only the element responsible for the current overflow,
      * reuse existing layout containers and responsive primitives,
      * preserve the intended large-screen cap while allowing the element to shrink.
    
    Do not broaden:
      * do not redesign unrelated layout,
      * do not hide overflow to mask an oversized element,
      * do not remove useful max-width constraints merely to pass the detector.
    
    Prove:
      * the current responsive acceptance passes at the smallest governed viewport,
      * the affected declaration no longer forces horizontal overflow.
  exceptions:
  - Vendored and generated trees (`node_modules`, `dist`, `build`, `_generated`) are never scanned.
  - '`max-width` is not judged; it is how wide layouts are meant to be bounded.'
  - 'Custom property definitions (`--page: 1200px`) define tokens and are not judged.'
metadata:
  aliases:
  - BUN-RESPONSIVE-RESPONSIVE-NO-FIXED-WIDTH-001
  severity: 3
  disposition: strict
  introduced_in: 0.5.0
implementation:
  type: validator
  ref: bun_responsive_detector
