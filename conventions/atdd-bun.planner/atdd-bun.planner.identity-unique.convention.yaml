schema_version: 1.1.0
rule_id: atdd-bun.planner.identity-unique
kind: rule
status: active
name: Plan identities are unique
statement: No two plan artifacts declare the same identity (`train_id`, `interlocking_id`, `journey_id`, `urn`,
  …). Package rule, strict.
terms:
- term_id: package_rule
  text: 'a rule of this package''s own gates (`atdd-bun.*`), realized by a package guard rather than a canonical
    planner node. It is held to the same per-rule checks as every convention: a convention, strict, a failing fixture,
    relationship edges.'
content:
  summary: Plan identities are unique.
  normative_text: A reference to a duplicated identity resolves to whichever file was read first.
  fix_hint: Rename one of the artifacts, or merge them.
  exceptions:
  - Vendored and generated trees (`node_modules`, `dist`, `build`, `_generated`) are never scanned.
metadata:
  aliases:
  - ATDD-BUN-PLANNER-IDENTITY-UNIQUE
  severity: 3
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: planner_plan_integrity
