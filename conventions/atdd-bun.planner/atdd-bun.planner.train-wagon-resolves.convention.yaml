schema_version: 1.1.0
rule_id: atdd-bun.planner.train-wagon-resolves
kind: rule
status: active
name: Train wagons resolve
statement: Every wagon a train lists under `wagons:` is declared as `wagon:<slug>`. Package rule, strict.
terms:
- term_id: package_rule
  text: 'a rule of this package''s own gates (`atdd-bun.*`), realized by a package guard rather than a canonical
    planner node. It is held to the same per-rule checks as every convention: a convention, strict, a failing fixture,
    relationship edges.'
content:
  summary: Train wagons resolve.
  normative_text: A train ordering a wagon that does not exist cannot run.
  fix_hint: Declare the wagon, or remove it from the train.
  exceptions:
  - Vendored and generated trees (`node_modules`, `dist`, `build`, `_generated`) are never scanned.
metadata:
  aliases:
  - ATDD-BUN-PLANNER-TRAIN-WAGON-RESOLVES
  severity: 3
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: planner_plan_integrity
