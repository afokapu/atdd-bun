schema_version: 1.1.0
rule_id: atdd-bun.planner.acceptance-identity
kind: rule
status: active
name: Embedded acceptances carry an acceptance identity
statement: Every acceptance embedded in a WMBT is an object whose `identity.urn` starts with `acc:`. Package rule,
  strict.
terms:
- term_id: package_rule
  text: 'a rule of this package''s own gates (`atdd-bun.*`), realized by a package guard rather than a canonical
    planner node. It is held to the same per-rule checks as every convention: a convention, strict, a failing fixture,
    relationship edges.'
content:
  summary: Embedded acceptances carry an acceptance identity.
  normative_text: Tests bind acceptances by that identity; one without it can never be proven.
  fix_hint: 'Give the acceptance `identity: { urn: acc:<wagon>:<id> }`.'
  exceptions:
  - Vendored and generated trees (`node_modules`, `dist`, `build`, `_generated`) are never scanned.
metadata:
  aliases:
  - ATDD-BUN-PLANNER-ACCEPTANCE-IDENTITY
  severity: 3
  disposition: strict
  introduced_in: 0.1.0
implementation:
  type: validator
  ref: planner_plan_integrity
