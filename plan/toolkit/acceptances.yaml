acceptances:
  - identity:
      urn: acc:toolkit:E001-UNIT-001-bound-test-file
      id: AC-UNIT-001
      purpose: Verify a new toolkit test can bind to declared behavior without adding reject-new debt.
      phase: GREEN
    harness:
      type: unit
      category: backend
      language_hint: typescript
    given:
      abstract:
        - A new Bun test file is added to the toolkit source repository.
        - The all-profile reject-new context remains frozen.
    when:
      abstract: The test declares its canonical identity and binds this acceptance.
      action: invoke
      target: atdd-bun traceability enforcement
    then:
      abstract:
        - The acceptance binding resolves from the toolkit plan catalog.
        - The new test introduces no candidate-only finding.
      assertions:
        - type: equals
          target: candidate-only finding count
          value: 0
    telemetry:
      disposition: not-applicable
      rationale: Deterministic detector findings fully expose this repository policy behavior without runtime telemetry.
    metadata:
      author: atdd-bun
      created: 2026-10-13

# These identities belong to this package's detector fixtures. Once the toolkit has a
# root plan, tester resolution treats the checkout as one consumer; cataloguing each
# fixture's intentionally valid binding preserves that truthful repository boundary.
# Deliberately invalid resolver fixtures remain undeclared and stay carried debt.
repository_fixture_bindings:
  acceptances:
    - acc:commons:E001-UNIT-001
    - acc:commons:E002-UNIT-001
    - acc:orders:E001-E2E-001
    - acc:orders:E001-E2E-002
    - acc:orders:E001-SMOKE-001-renders-row
